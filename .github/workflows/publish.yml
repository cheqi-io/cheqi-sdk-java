name: Publish cheqi-sdk to Maven Central

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: cheqi-sdk-java-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Ensure release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify tag matches project version
        shell: bash
        run: |
          gradle_version="$(sed -n "s/^version = '\([^']*\)'$/\1/p" build.gradle)"
          maven_version="$(awk -F '[<>]' '/<version>/{print $3; exit}' pom.xml)"
          expected_tag="v${gradle_version}"

          if [[ -z "$gradle_version" || "$gradle_version" != "$maven_version" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag '$GITHUB_REF_NAME', Gradle version '$gradle_version', and Maven version '$maven_version' must match." >&2
            exit 1
          fi

      - name: Verify generated models are committed
        run: |
          mvn -B -q generate-sources
          git diff --exit-code -I '^@javax\.annotation\.Generated' -- src/main/java/com/cheqi/sdk/models/generated

      - name: Validate release artifacts
        run: ./gradlew clean check javadocJar sourcesJar publishToMavenLocal --no-daemon --console=plain

  publish:
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Publish to Maven Central
        run: |
          # Decode base64 GPG key
          export SIGNING_KEY=$(echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d)
          
          ./gradlew publishAllPublicationsToCentralPortal --no-daemon \
            -PsigningKey="$SIGNING_KEY" \
            -PsigningPassword="${{ secrets.GPG_PASSPHRASE }}"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}

      - name: Summary
        run: |
          echo "✅ cheqi-sdk published to Maven Central!" >> $GITHUB_STEP_SUMMARY
          echo "Check status at: https://central.sonatype.com/artifact/io.cheqi/cheqi-sdk" >> $GITHUB_STEP_SUMMARY
